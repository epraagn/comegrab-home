<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Orbit Dash</title>
<style>
  html,body{margin:0;height:100%;background:#070b18;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W, H, cx, cy, R, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H / 2; R = Math.min(W, H) * 0.34;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- storage (safe) ----
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  let best = store.get('od_best', 0);
  let muted = store.get('od_muted', false);

  // ---- audio ----
  let actx = null;
  function initAudio() {
    if (actx) return;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  function beep(freq, dur, type, vol) {
    if (muted || !actx) return;
    try {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.08, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // ---- game state ----
  let state = 'menu'; // menu | play | paused | over
  let a, dir, time, score, spawnT, starT, meteors, stars, parts, trail, shake, deadAt;

  function reset() {
    a = -Math.PI / 2; dir = 1; time = 0; score = 0;
    spawnT = 1; starT = 1.5;
    meteors = []; stars = []; parts = []; trail = []; shake = 0;
  }
  reset();

  const speed = () => 2.1 + Math.min(time, 90) * 0.012;
  const PR = 7; // player radius

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 160;
      parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 0.5 + Math.random() * 0.4, max: 0.9, color });
    }
  }

  function spawnMeteor() {
    const dStart = Math.hypot(W, H) / 2 + 30;
    const v = R * (1.15 + Math.min(time, 80) * 0.011);
    let ang;
    if (Math.random() < Math.min(0.55, 0.15 + time * 0.01)) {
      const t = (dStart - R) / v;           // aim where the player would be
      ang = a + dir * speed() * t;
    } else {
      ang = Math.random() * Math.PI * 2;
    }
    meteors.push({ a: ang, d: dStart, v, r: 9 + Math.random() * 5 });
  }

  function die() {
    state = 'over';
    deadAt = performance.now();
    shake = 0.5;
    const px = cx + Math.cos(a) * R, py = cy + Math.sin(a) * R;
    burst(px, py, '#ff6b6b', 36);
    beep(110, 0.45, 'sawtooth', 0.12);
    if (score > best) { best = score; store.set('od_best', best); }
  }

  function update(dt) {
    if (shake > 0) shake = Math.max(0, shake - dt);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    if (state !== 'play') return;

    time += dt;
    a += dir * speed() * dt;
    const px = cx + Math.cos(a) * R, py = cy + Math.sin(a) * R;
    trail.push({ x: px, y: py });
    if (trail.length > 14) trail.shift();

    spawnT -= dt;
    if (spawnT <= 0) { spawnT = Math.max(0.42, 1.25 - time * 0.011); spawnMeteor(); }

    starT -= dt;
    if (starT <= 0 && stars.length < 2) {
      starT = 2; stars.push({ a: Math.random() * Math.PI * 2, life: 4.5 });
    }

    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.d -= m.v * dt;
      const mx = cx + Math.cos(m.a) * m.d, my = cy + Math.sin(m.a) * m.d;
      if (Math.hypot(mx - px, my - py) < m.r + PR - 1) { die(); return; }
      if (m.d < -20) meteors.splice(i, 1);
    }

    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.life -= dt;
      const sx = cx + Math.cos(s.a) * R, sy = cy + Math.sin(s.a) * R;
      if (Math.hypot(sx - px, sy - py) < PR + 11) {
        score++; stars.splice(i, 1);
        burst(sx, sy, '#ffd54a', 14);
        beep(660 + Math.min(score, 20) * 12, 0.12, 'triangle', 0.09);
      } else if (s.life <= 0) {
        stars.splice(i, 1);
      }
    }
  }

  // ---- drawing ----
  function text(str, x, y, size, color, weight) {
    ctx.font = (weight || '700') + ' ' + size + 'px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }

  function draw() {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
    g.addColorStop(0, '#16224a'); g.addColorStop(1, '#070b18');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 30, (Math.random() - 0.5) * shake * 30);

    // ring
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(120,160,255,0.28)';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();

    // stars
    for (const s of stars) {
      const sx = cx + Math.cos(s.a) * R, sy = cy + Math.sin(s.a) * R;
      const pulse = 1 + Math.sin(performance.now() / 150) * 0.15;
      const fade = Math.min(1, s.life / 1);
      ctx.globalAlpha = fade;
      ctx.shadowColor = '#ffd54a'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#ffd54a';
      ctx.beginPath(); ctx.arc(sx, sy, 8 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }

    // meteors
    for (const m of meteors) {
      const mx = cx + Math.cos(m.a) * m.d, my = cy + Math.sin(m.a) * m.d;
      const tx = cx + Math.cos(m.a) * (m.d + 46), ty = cy + Math.sin(m.a) * (m.d + 46);
      const grad = ctx.createLinearGradient(mx, my, tx, ty);
      grad.addColorStop(0, 'rgba(255,107,107,0.9)'); grad.addColorStop(1, 'rgba(255,107,107,0)');
      ctx.strokeStyle = grad; ctx.lineWidth = m.r * 1.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.shadowColor = '#ff6b6b'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#ff8a8a';
      ctx.beginPath(); ctx.arc(mx, my, m.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // player
    if (state !== 'over') {
      for (let i = 0; i < trail.length; i++) {
        const t = trail[i], k = i / trail.length;
        ctx.fillStyle = 'rgba(160,220,255,' + (k * 0.45) + ')';
        ctx.beginPath(); ctx.arc(t.x, t.y, PR * k, 0, Math.PI * 2); ctx.fill();
      }
      const px = cx + Math.cos(a) * R, py = cy + Math.sin(a) * R;
      ctx.shadowColor = '#9fe2ff'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(px, py, PR, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // particles
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // UI
    const unit = Math.min(W, H);
    if (state === 'play' || state === 'paused') {
      text(String(score), cx, cy, unit * 0.16, 'rgba(255,255,255,0.9)', '800');
    }
    if (state === 'menu') {
      text('ORBIT DASH', cx, cy - unit * 0.06, unit * 0.11, '#ffffff', '800');
      text('Tap to flip direction', cx, cy + unit * 0.04, unit * 0.04, 'rgba(255,255,255,0.75)', '500');
      text('Collect stars. Dodge meteors.', cx, cy + unit * 0.09, unit * 0.04, 'rgba(255,255,255,0.75)', '500');
      text('TAP TO START', cx, H - unit * 0.18, unit * 0.05, '#9fe2ff', '700');
      if (best > 0) text('Best: ' + best, cx, H - unit * 0.11, unit * 0.04, '#ffd54a', '600');
    }
    if (state === 'paused') {
      text('PAUSED', cx, cy - unit * 0.2, unit * 0.07, '#ffffff', '800');
      text('Tap to resume', cx, cy + unit * 0.2, unit * 0.045, '#9fe2ff', '600');
    }
    if (state === 'over') {
      text('GAME OVER', cx, cy - unit * 0.12, unit * 0.09, '#ff8a8a', '800');
      text('Score ' + score, cx, cy, unit * 0.07, '#ffffff', '700');
      text('Best ' + best, cx, cy + unit * 0.08, unit * 0.05, '#ffd54a', '600');
      if (performance.now() - deadAt > 600) {
        text('TAP TO RETRY', cx, cy + unit * 0.22, unit * 0.05, '#9fe2ff', '700');
      }
    }
    // sound toggle
    text(muted ? '\uD83D\uDD07' : '\uD83D\uDD0A', W - 32, 36, 24, '#ffffff', '400');
  }

  // ---- input ----
  function onTap(x, y) {
    initAudio();
    if (x > W - 64 && y < 64) {
      muted = !muted; store.set('od_muted', muted);
      return;
    }
    if (state === 'menu') { reset(); state = 'play'; beep(520, 0.1, 'triangle'); }
    else if (state === 'play') { dir = -dir; beep(300, 0.05, 'square', 0.04); }
    else if (state === 'paused') { state = 'play'; }
    else if (state === 'over') {
      if (performance.now() - deadAt > 600) { reset(); state = 'play'; beep(520, 0.1, 'triangle'); }
    }
  }
  window.addEventListener('pointerdown', (e) => { e.preventDefault(); onTap(e.clientX, e.clientY); }, { passive: false });
  window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); onTap(W / 2, H / 2); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'paused'; });
  window.addEventListener('blur', () => { if (state === 'play') state = 'paused'; });

  // ---- loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
